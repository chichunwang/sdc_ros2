# Optional overlay for the remote Ubuntu host's existing X11 display.
# Enable with: bash scripts/dev.sh --gui up
services:
  midterm01:
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        bind:
          create_host_path: false


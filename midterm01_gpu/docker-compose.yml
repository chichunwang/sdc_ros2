services:
  midterm01_gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-120}
    image: sdc_midterm01_gpu_ros2:cuda12.8
    container_name: ${MIDTERM_GPU_CONTAINER_NAME:-sdc_midterm01_gpu}
    working_dir: /root/midterm
    init: true
    stdin_open: true
    tty: true
    network_mode: host
    shm_size: "2gb"
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-2}
      ROS_LOCALHOST_ONLY: "1"
      BUILD_WORKERS: ${BUILD_WORKERS:-2}
      CMAKE_CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-120}
    volumes:
      - type: bind
        source: ./workspace
        target: /root/midterm
        bind:
          create_host_path: false
      - type: bind
        source: ${MIDTERM_GPU_DATA_DIR:-../midterm01/data}
        target: /root/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../midterm01/config
        target: /root/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../midterm01/scripts/check_data.py
        target: /root/reference/check_data.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts
        target: /root/scripts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./outputs
        target: /root/outputs
        bind:
          create_host_path: false


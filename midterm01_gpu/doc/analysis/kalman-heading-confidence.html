<div id="kalman-heading-confidence">
  <style>
    #kalman-heading-confidence { color:var(--foreground); }
    #kalman-heading-confidence .kf-title { padding-right:96px; }
    #kalman-heading-confidence .kf-chart { display:block; width:100%; }
    #kalman-heading-confidence .kf-chart text { fill:var(--foreground); font-size:12px; }
    #kalman-heading-confidence .kf-result { margin-top:12px; }
    #kalman-heading-confidence .kf-chart .moving { transition:x .18s ease,width .18s ease,cx .18s ease; }
    @media (prefers-reduced-motion:reduce) {
      #kalman-heading-confidence .kf-chart .moving { transition:none; }
    }
  </style>
  <h3 class="kf-title">兩個角度估計，該相信哪一個？</h3>
  <div class="viz-controls">
    <label class="form-label" for="kf-prediction-error">預測誤差尺度 σ：<span id="kf-prediction-number" class="tabular-nums">2.0°</span>
      <input id="kf-prediction-error" class="form-range" type="range" min="0.5" max="5" step="0.1" value="2" />
    </label>
    <label class="form-label" for="kf-map-error">地圖誤差尺度 σ：<span id="kf-map-number" class="tabular-nums">1.0°</span>
      <input id="kf-map-error" class="form-range" type="range" min="0.5" max="5" step="0.1" value="1" />
    </label>
  </div>
  <svg id="kf-heading-chart" class="kf-chart" role="img" aria-label="合成角度估計；色帶表示正負一個標準差，直線表示估計角度。"></svg>
  <div id="kf-heading-result" class="kf-result tabular-nums" aria-live="polite"></div>
  <div class="text-small text-muted">色帶：±1 個標準差　｜　合成教學數字</div>
  <script>
    (() => {
      const root = document.getElementById('kalman-heading-confidence');
      const predictionInput = root.querySelector('#kf-prediction-error');
      const mapInput = root.querySelector('#kf-map-error');
      const predictionNumber = root.querySelector('#kf-prediction-number');
      const mapNumber = root.querySelector('#kf-map-number');
      const svg = root.querySelector('#kf-heading-chart');
      const result = root.querySelector('#kf-heading-result');
      const clamp = value => Math.max(.5, Math.min(5, Number(value) || 1));
      function draw() {
        const sp = clamp(predictionInput.value), sm = clamp(mapInput.value);
        const gain = sp*sp/(sp*sp+sm*sm);
        const merged = 30+gain*(32-30);
        const uncertainty = Math.sqrt((1-gain)*sp*sp);
        predictionNumber.textContent = sp.toFixed(1)+'°';
        mapNumber.textContent = sm.toFixed(1)+'°';
        result.textContent = '地圖修正權重 '+(100*gain).toFixed(0)+'%　｜　合併角度 '+merged.toFixed(2)+'°';
        const rows = [
          {name:'運動預測', mean:30, sigma:sp, color:'var(--viz-series-2)'},
          {name:'地圖配準', mean:32, sigma:sm, color:'var(--viz-series-3)'},
          {name:'合併估計', mean:merged, sigma:uncertainty, color:'var(--viz-series-1)'}
        ];
        const width = Math.max(280, svg.getBoundingClientRect().width || root.getBoundingClientRect().width || 600);
        const minimum = Math.min(...rows.map(row => row.mean-row.sigma));
        const maximum = Math.max(...rows.map(row => row.mean+row.sigma));
        const padding = (maximum-minimum)*.12;
        const lo = minimum-padding, hi = maximum+padding;
        const x = value => 28+(value-lo)/(hi-lo)*(width-56);
        svg.setAttribute('viewBox', '0 0 '+width+' 258');
        svg.setAttribute('height', '258');
        const svgRows = rows.map((row, i) => {
          const y = 26+i*65;
          const detail = row.mean.toFixed(2)+'° ± '+row.sigma.toFixed(2)+'°';
          return `<g><text x="24" y="${y}">${row.name}</text><text x="${width-24}" y="${y}" text-anchor="end">${detail}</text><rect class="moving" x="${x(row.mean-row.sigma)}" y="${y+12}" width="${x(row.mean+row.sigma)-x(row.mean-row.sigma)}" height="14" fill="${row.color}" opacity="0.2"/><line x1="${x(row.mean)}" x2="${x(row.mean)}" y1="${y+8}" y2="${y+30}" stroke="${row.color}" stroke-width="3"/></g>`;
        }).join('');
        const tickCount = width < 400 ? 3 : 4;
        let ticks = '';
        for (let i=0; i<tickCount; i++) {
          const value = lo+(hi-lo)*i/(tickCount-1);
          const anchor = i===0 ? 'start' : i===tickCount-1 ? 'end' : 'middle';
          ticks += `<line x1="${x(value)}" x2="${x(value)}" y1="210" y2="215" stroke="var(--border)"/><text x="${x(value)}" y="231" text-anchor="${anchor}">${value.toFixed(1)}</text>`;
        }
        svg.innerHTML = `<title>角度估計的信任權重</title><desc>運動預測為30度，地圖配準為32度。標準差較小的一邊獲得較大的權重。</desc><rect data-chart-frame x="12" y="4" width="${width-24}" height="202" fill="none" stroke="var(--border)"/>${svgRows}<line x1="28" x2="${width-28}" y1="210" y2="210" stroke="var(--border)"/>${ticks}<text class="axis-title" data-axis="x" x="${width/2}" y="253" text-anchor="middle">航向角（°）</text>`;
      }
      function restore(state) {
        const saved = state?.modelContent;
        if (saved?.kind === 'kalman-heading-confidence') {
          predictionInput.value = clamp(saved.predictionStd);
          mapInput.value = clamp(saved.mapStd);
        }
        draw();
      }
      function remember() {
        const modelContent = {kind:'kalman-heading-confidence', predictionStd:clamp(predictionInput.value), mapStd:clamp(mapInput.value)};
        if (window.openai?.setWidgetState) {
          window.openai.setWidgetState({modelContent, privateContent:null}).catch(() => {});
        }
      }
      predictionInput.addEventListener('input', draw);
      mapInput.addEventListener('input', draw);
      predictionInput.addEventListener('change', remember);
      mapInput.addEventListener('change', remember);
      window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState));
      restore(window.openai?.widgetState);
      new ResizeObserver(draw).observe(root);
    })();
  </script>
</div>
